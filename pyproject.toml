[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailshieldv1"
version = "0.1.0"
description = "Local, deterministic email threat analysis engine (no AI; offline by default)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mailshieldv1 contributors" }]
keywords = ["email", "phishing", "security", "headers", "eml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
online = [
  "dnspython>=2.6",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "dnspython>=2.6",
]
[project.scripts]
mailshieldv1 = "mailshieldv1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailshieldv1 = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.bandit]
skips = ["B101"]
