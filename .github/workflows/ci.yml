name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U "pip" "setuptools>=84.1.0" "wheel"
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -m "not network and not pot"
      - name: Bandit
        run: bandit -r src/mailshieldv1 -ll
      - name: pip-audit
        run: pip-audit

  pot-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U "pip" "setuptools>=84.1.0" "wheel"
          python -m pip install -e ".[dev]"
      - name: Clone phishing_pot (sparse email/)
        run: |
          mkdir -p samples/phishing/badsamples
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/rf-peixoto/phishing_pot.git \
            samples/phishing/badsamples/phishing_pot
          git -C samples/phishing/badsamples/phishing_pot sparse-checkout set email
      - name: Pot calibration tests
        run: pytest -m "pot and not network" -q
